# ==============================================================================
# NGINX Configuration for WORKPRISE.FR Architecture
# Covers: workprise.fr, agent.workprise.fr, portal.workprise.fr, api.workprise.fr
# ==============================================================================

# 1. Main French Portal & Showcase (workprise.fr & www.workprise.fr)
server {
    listen 80;
    listen [::]:80;
    server_name workprise.fr www.workprise.fr;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Clara Agent Docs & Skills Catalog (agent.workprise.fr)
server {
    listen 80;
    listen [::]:80;
    server_name agent.workprise.fr;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Clara Web Dashboard & Session Manager (portal.workprise.fr)
server {
    listen 80;
    listen [::]:80;
    server_name portal.workprise.fr;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:9119;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live agent streaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 4. Clara Inference & Gateway API Server (api.workprise.fr)
server {
    listen 80;
    listen [::]:80;
    server_name api.workprise.fr;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming SSE / Long-polling timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
